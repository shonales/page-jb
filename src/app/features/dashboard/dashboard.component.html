<main class="dashboard-page">
  <section class="welcome">
    <div>
      <h1>{{ greeting.title }}</h1>
      <p class="lead">{{ greeting.message }}</p>
    </div>

    <time class="period">{{ greeting.periodLabel }}</time>
  </section>

  <section class="action-grid" aria-label="Acciones principales">
    @for (action of actions; track action.path) {
      <a
        class="action-card"
        [class]="action.accent"
        [routerLink]="action.path"
        [style.background-image]="'linear-gradient(180deg, rgba(14, 11, 14, 0.08), rgba(14, 11, 14, 0.64)), url(' + action.cover + ')'"
      >
        <h2>{{ action.title }}</h2>
      </a>
    }
  </section>
</main>
