@if (showShell()) {
  <div class="app-shell">
    <header class="topbar">
      <a class="profile-link" routerLink="/dashboard" aria-label="Volver al dashboard">
        <span class="profile-avatar">
          @if (avatarUrl()) {
            <img [src]="avatarUrl()!" [alt]="profileName()" />
          } @else {
            {{ profileInitials() }}
          }
        </span>
        <span class="profile-copy">
          <strong>{{ profileName() }}</strong>
          <small>Page JB</small>
        </span>
      </a>

      <nav aria-label="Secciones principales">
        @for (item of navItems; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
        }
      </nav>

      <button class="logout" type="button" (click)="logout()">Salir</button>
    </header>

    <router-outlet />

    <footer>
      <p>Hecho para Jhon Alex Morales Apaza y Behetsave Yobana Luza Cabana.</p>
      <span>04/05/2025</span>
    </footer>
  </div>
} @else {
  <router-outlet />
}
